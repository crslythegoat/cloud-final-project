# Install as /etc/nginx/sites-available/cloud-db; adjust server_name and certificates.
# A local CA/self-signed certificate must be trusted on presentation clients.
server {
    listen 443 ssl;
    server_name cloud-db.local;
    ssl_certificate /etc/cloud-db/tls/server.crt;
    ssl_certificate_key /etc/cloud-db/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
    # Swagger uses external assets; keep it local for the initial LAN deployment.
    location /docs { deny all; }
    location /redoc { deny all; }
}
